<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77C" />
      <stop offset="50%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#9E7D47" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#121212" />
  <g transform="translate(10, 8)">
    <!-- Tower 1 -->
    <path d="M4,20 L14,14 L14,46 L4,46 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tower 2 (Center, tallest) -->
    <path d="M17,10 L27,4 L27,46 L17,46 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Tower 3 -->
    <path d="M30,26 L40,20 L40,46 L30,46 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
